<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Solicitation Requests | Tides of Hope</title>

    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .page-wrap {
            max-width: 850px;
            margin: 40px auto;
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .page-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: #0b4f6c;
            margin-bottom: 8px;
        }

        .search-box {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-box input {
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .search-box button {
            background: #0b4f6c;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .request-card {
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
            background: #fbfdff;
        }

        .request-card h3 {
            margin: 0 0 8px;
            color: #0b4f6c;
        }

        .meta {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            background: #e8f1ff;
            color: #0b4f6c;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .actions a {
            text-decoration: none;
            background: #0b4f6c;
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .actions a.secondary {
            background: #147a8c;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
            display: none;
        }
    </style>
</head>

<body>

    <main class="page-wrap">
        <div class="page-header">
            <h1>My Solicitation Requests</h1>
            <p>Enter your contact number to view and download your generated solicitation letter.</p>
        </div>

        <div class="search-box">
            <input type="text" id="contactNumberSearch" placeholder="Enter contact number used in the request" />
            <button type="button" id="searchBtn">Search My Requests</button>
        </div>

        <div id="results"></div>

        <div class="empty" id="emptyMessage">
            No solicitation requests found for this contact number.
        </div>
    </main>

    <script src="assets/js/my-solicitations.js"></script>
</body>

</html>

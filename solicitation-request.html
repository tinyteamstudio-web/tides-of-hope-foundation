<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOH Solicitation Request</title>

    <link rel="stylesheet" href="assets/css/main.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .request-container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .request-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .request-header h1 {
            color: #0b4f6c;
            margin-bottom: 10px;
        }

        .request-header p {
            color: #555;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            background: #0b4f6c;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn:hover {
            background: #08384d;
        }

        .success-message {
            display: none;
            margin-top: 20px;
            background: #dff6e4;
            color: #207245;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="request-container">

        <div class="request-header">
            <h1>Solicitation Request Form</h1>

            <p>
                Submit sponsorship and solicitation requests
                for approval by the Tides of Hope Secretary Office.
            </p>
        </div>

        <form id="solicitationForm">

            <div class="form-group">
                <label>Letter Date</label>
                <input type="date" id="letterDate" required>
            </div>

            <div class="form-group">
                <label>Recipient Name</label>
                <input type="text" id="recipientName" required>
            </div>

            <div class="form-group">
                <label>Recipient Position</label>
                <input type="text" id="recipientPosition">
            </div>

            <div class="form-group">
                <label>Company / Organization</label>
                <input type="text" id="companyName" required>
            </div>

            <div class="form-group">
                <label>Salutation</label>

                <select id="salutation">
                    <option value="">None</option>
                    <option>Hon.</option>
                    <option>Mr.</option>
                    <option>Ms.</option>
                    <option>Mrs.</option>
                    <option>Dr.</option>
                    <option>Atty.</option>
                    <option>Engr.</option>
                </select>
            </div>

            <div class="form-group">
                <label>Contact Person</label>
                <input type="text" id="contactPerson" required>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="text" id="contactNumber" required>
            </div>

            <div class="form-group">
                <label>Requested Support</label>

                <textarea id="requestedItems"
                    placeholder="Example: Financial assistance, medicines, transportation support..."></textarea>
            </div>

            <div class="form-group">
                <label>Purpose / Notes</label>

                <textarea id="messageBody"
                    placeholder="Additional message or purpose..."></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit Solicitation Request
            </button>

            <div class="success-message" id="successMessage">
                Solicitation request submitted successfully.
            </div>

        </form>

    </div>

    <script src="assets/js/solicitation-request.js"></script>

</body>

</html>
